<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>안전서류 자동생성기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1F4E79;--navy2:#2E75B6;--navy3:#D6E4F0;--navy4:#EBF3FB;
  --green:#1a7f37;--green2:#dafbe1;--red:#cf222e;--red2:#fff0f0;
  --amber:#9a6700;--amber2:#fff8e1;--gray:#f7f9fc;--gray2:#e2e8f0;--gray3:#718096;
  --text:#1a1a2e;--text2:#4a5568;--r:8px;--sh:0 1px 4px rgba(0,0,0,.08)}
body{font-family:'맑은 고딕','Malgun Gothic',sans-serif;background:#eef2f7;color:var(--text);font-size:14px}
.hdr{background:var(--navy);color:#fff;padding:0 20px;height:52px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.hdr-title{font-size:15px;font-weight:700}
.hdr-badge{background:#F0A500;color:#111;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px}
.hdr-ver{margin-left:auto;font-size:11px;color:rgba(255,255,255,.5)}
.wrap{max-width:1100px;margin:0 auto;padding:18px;display:grid;grid-template-columns:340px 1fr;gap:16px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
/* 입력 패널 */
.panel{background:#fff;border:1px solid var(--gray2);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.panel-hdr{background:var(--navy);color:#fff;padding:10px 16px;font-size:13px;font-weight:700}
.panel-body{padding:16px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.fg input,.fg select,.fg textarea{width:100%;padding:8px 11px;border:1.5px solid var(--gray2);border-radius:var(--r);font-family:inherit;font-size:13px;outline:none;transition:border-color .15s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--navy2)}
.fg textarea{resize:vertical;min-height:56px}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* 빠른선택 */
.quick-label{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px}
.quick-btns{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.qbtn{font-family:inherit;font-size:11px;padding:5px 10px;border:1px solid var(--navy3);border-radius:99px;background:var(--navy4);color:var(--navy);cursor:pointer;font-weight:600;transition:all .12s}
.qbtn:hover{background:var(--navy);color:#fff}
/* 생성 버튼 */
.gen-btn{width:100%;padding:13px;background:var(--navy);color:#fff;border:none;border-radius:var(--r);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s}
.gen-btn:hover{background:#153352}
.gen-btn:active{transform:scale(.98)}
/* 결과 패널 */
.tabs{display:flex;border-bottom:2px solid var(--gray2)}
.tab{padding:10px 16px;font-size:13px;font-weight:600;color:var(--gray3);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-2px;font-family:inherit}
.tab.on{color:var(--navy);border-bottom-color:var(--navy)}
.doc-area{display:none;padding:16px}
.doc-area.on{display:block}
.doc-content{background:var(--gray);border:1px solid var(--gray2);border-radius:var(--r);padding:16px;font-size:13px;line-height:1.8;white-space:pre-wrap;min-height:300px;font-family:'맑은 고딕',monospace}
.doc-empty{text-align:center;padding:60px 20px;color:var(--gray3)}
.doc-empty .icon{font-size:40px;margin-bottom:12px}
.btn-row{display:flex;gap:8px;margin-bottom:10px}
.btn{font-family:inherit;font-size:12px;font-weight:600;padding:7px 14px;border-radius:var(--r);border:none;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btn-sec{background:#fff;color:var(--navy);border:1px solid var(--gray2)}.btn-sec:hover{background:var(--gray)}
.btn-success{background:var(--green);color:#fff}
/* 로딩 */
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin .7s linear infinite}
</style>
</head>
<body>

<header class="hdr">
  <span style="font-size:18px">📝</span>
  <span class="hdr-title">안전서류 자동생성기</span>
  <span class="hdr-badge">무료</span>
  <span class="hdr-ver">API 불필요 · 즉시 사용</span>
</header>

<div class="wrap">
  <!-- 입력 패널 -->
  <div>
    <div class="panel">
      <div class="panel-hdr">📋 작업 정보 입력</div>
      <div class="panel-body">
        <div class="quick-label">빠른 작업 선택</div>
        <div class="quick-btns">
          <button class="qbtn" onclick="quickSelect('공조기 미디엄필터 교체 작업','기계실 공조기실','공조테크','1일 / 2명','기계·설비')">공조기 필터 교체</button>
          <button class="qbtn" onclick="quickSelect('외벽 누수 실리콘 코킹 작업','건물 외벽 전면','방수전문업체','3일 / 2명','외벽·방수')">외벽 코킹</button>
          <button class="qbtn" onclick="quickSelect('전기안전진단 정기검사','B2F 수변전실·각층 분전반','전기안전공사','1일 / 3명','전기')">전기안전진단</button>
          <button class="qbtn" onclick="quickSelect('냉각탑 상부 고소작업 점검','옥상 냉각탑','자체','1일 / 2명','기계·설비')">냉각탑 점검</button>
          <button class="qbtn" onclick="quickSelect('소방설비 자체점검','전층 소방설비','소방안전(주)','1일 / 2명','소방')">소방점검</button>
          <button class="qbtn" onclick="quickSelect('천장 배관 보온재 교체 작업','기계실·각층 천장 배관','협력업체','2일 / 3명','기계·설비')">배관 보온</button>
          <button class="qbtn" onclick="quickSelect('UPS 배터리 교체 작업','4층 UPS실','전기업체','1일 / 2명','전기')">UPS 배터리</button>
          <button class="qbtn" onclick="quickSelect('저수조 오름사다리 안전후크 설치','지하 기계실 저수조','자체','1일 / 2명','기계·설비')">안전후크 설치</button>
        </div>

        <div class="fg">
          <label>작업명 *</label>
          <input type="text" id="workName" placeholder="예) 공조기 미디엄필터 교체 작업">
        </div>
        <div class="fg-row">
          <div class="fg">
            <label>작업일시</label>
            <input type="date" id="workDate">
          </div>
          <div class="fg">
            <label>작업분류</label>
            <select id="workType">
              <option>전기</option><option>기계·설비</option><option>외벽·방수</option>
              <option>소방</option><option>고소작업</option><option>배관·위생</option><option>기타</option>
            </select>
          </div>
        </div>
        <div class="fg">
          <label>작업장소</label>
          <input type="text" id="workPlace" placeholder="예) B2F 전기실, 옥상, 기계실">
        </div>
        <div class="fg-row">
          <div class="fg">
            <label>작업업체</label>
            <input type="text" id="workVendor" placeholder="예) 전기안전공사">
          </div>
          <div class="fg">
            <label>기간 / 인원</label>
            <input type="text" id="workPeriod" placeholder="예) 1일 / 2명">
          </div>
        </div>
        <div class="fg">
          <label>특이사항 (선택)</label>
          <textarea id="workNote" placeholder="위험요인, 사용장비, 특이사항 등 입력 시 더 정확한 문서가 생성됩니다."></textarea>
        </div>
        <button class="gen-btn" onclick="genAll()">
          <span id="genIcon">⚡</span> 3종 문서 자동생성
        </button>
      </div>
    </div>
  </div>

  <!-- 결과 패널 -->
  <div class="panel">
    <div class="tabs">
      <button class="tab on" onclick="switchTab(0)" id="tab0">⚠️ 위험성평가표</button>
      <button class="tab" onclick="switchTab(1)" id="tab1">📋 TBM 일지</button>
      <button class="tab" onclick="switchTab(2)" id="tab2">✅ 작업완료보고서</button>
    </div>

    <div class="doc-area on" id="area0">
      <div class="btn-row" id="btns0" style="display:none">
        <button class="btn btn-sec" onclick="copyDoc(0)">📄 복사</button>
        <button class="btn btn-sec" onclick="printDoc(0)">🖨️ 인쇄</button>
      </div>
      <div class="doc-content" id="doc0">
        <div class="doc-empty">
          <div class="icon">📝</div>
          <div>작업 정보를 입력하고<br>자동생성 버튼을 누르면<br>문서가 여기에 나타납니다.</div>
        </div>
      </div>
    </div>

    <div class="doc-area" id="area1">
      <div class="btn-row" id="btns1" style="display:none">
        <button class="btn btn-sec" onclick="copyDoc(1)">📄 복사</button>
        <button class="btn btn-sec" onclick="printDoc(1)">🖨️ 인쇄</button>
      </div>
      <div class="doc-content" id="doc1">
        <div class="doc-empty"><div class="icon">📋</div><div>TBM 일지가 여기에 생성됩니다.</div></div>
      </div>
    </div>

    <div class="doc-area" id="area2">
      <div class="btn-row" id="btns2" style="display:none">
        <button class="btn btn-sec" onclick="copyDoc(2)">📄 복사</button>
        <button class="btn btn-sec" onclick="printDoc(2)">🖨️ 인쇄</button>
      </div>
      <div class="doc-content" id="doc2">
        <div class="doc-empty"><div class="icon">✅</div><div>작업완료보고서가 여기에 생성됩니다.</div></div>
      </div>
    </div>
  </div>
</div>

<script>
// 설정 불러오기
function getOrg(){
  try{return JSON.parse(localStorage.getItem('fm_org'))||{org:'우리 사업소',leader:'반장',elec:'전기안전관리자',p1:'담당자1',p2:'담당자2'};}
  catch(e){return {org:'우리 사업소',leader:'반장',elec:'전기안전관리자',p1:'담당자1',p2:'담당자2'};}
}

// 초기화
window.onload=function(){
  const d=new Date();
  document.getElementById('workDate').value=new Date().toISOString().slice(0,10);
};

// 빠른 선택
function quickSelect(name,place,vendor,period,type){
  document.getElementById('workName').value=name;
  document.getElementById('workPlace').value=place;
  document.getElementById('workVendor').value=vendor;
  document.getElementById('workPeriod').value=period;
  const sel=document.getElementById('workType');
  for(let i=0;i<sel.options.length;i++){if(sel.options[i].value===type){sel.selectedIndex=i;break;}}
}

// 탭 전환
function switchTab(n){
  [0,1,2].forEach(i=>{
    document.getElementById('tab'+i).classList.toggle('on',i===n);
    document.getElementById('area'+i).classList.toggle('on',i===n);
  });
}

function copyDoc(n){
  const txt=document.getElementById('doc'+n).textContent;
  navigator.clipboard.writeText(txt).then(()=>alert('✅ 클립보드에 복사되었습니다!\nWord에 붙여넣기 하시면 됩니다.'));
}

function printDoc(n){
  const w=window.open('','_blank');
  const txt=document.getElementById('doc'+n).textContent;
  w.document.write(`<html><body><pre style="font-family:'맑은 고딕';font-size:12pt;line-height:1.8">${txt}</pre></body></html>`);
  w.document.close();w.print();
}
