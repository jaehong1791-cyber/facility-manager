<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시설관리 프로그램</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap');

  *{box-sizing:border-box;margin:0;padding:0}

  :root{
    --navy:#1F4E79;
    --navy-dark:#153352;
    --navy-light:#2E75B6;
    --sky:#D6E4F0;
    --sky2:#EBF3FB;
    --accent:#F0A500;
    --success:#1a7f37;
    --success-bg:#dafbe1;
    --error:#cf222e;
    --error-bg:#fff0f0;
    --text:#1a1a2e;
    --text2:#4a5568;
    --text3:#718096;
    --border:#e2e8f0;
    --bg:#f7f9fc;
    --white:#ffffff;
    --radius:8px;
    --radius-lg:12px;
    --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
    --shadow-md:0 4px 12px rgba(0,0,0,.1);
  }

  body{
    font-family:'Noto Sans KR',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    font-size:14px;
    line-height:1.6;
  }

  /* ── 헤더 ── */
  .site-header{
    background:var(--navy);
    color:#fff;
    padding:0 24px;
    display:flex;
    align-items:center;
    height:56px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
  }
  .site-header .logo{
    display:flex;align-items:center;gap:10px;
    font-size:15px;font-weight:700;letter-spacing:-.3px;
  }
  .site-header .logo-badge{
    background:var(--accent);
    color:#1a1a00;
    font-size:10px;font-weight:700;
    padding:2px 6px;border-radius:4px;
    margin-left:4px;
  }
  .site-header .sub{
    margin-left:auto;
    font-size:12px;
    color:rgba(255,255,255,.65);
  }

  /* ── 레이아웃 ── */
  .container{
    max-width:1100px;
    margin:0 auto;
    padding:28px 24px;
    display:grid;
    grid-template-columns:340px 1fr;
    gap:24px;
    align-items:start;
  }

  /* ── 카드 공통 ── */
  .card{
    background:var(--white);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .card-header{
    background:var(--navy);
    color:#fff;
    padding:14px 18px;
    display:flex;align-items:center;gap:8px;
    font-size:13px;font-weight:700;letter-spacing:.3px;
  }
  .card-header svg{width:16px;height:16px;flex-shrink:0}
  .card-body{padding:18px}

  /* ── 입력 폼 ── */
  .form-group{margin-bottom:14px}
  .form-group:last-child{margin-bottom:0}
  label{
    display:block;
    font-size:12px;font-weight:600;
    color:var(--text2);
    margin-bottom:5px;
    letter-spacing:.2px;
  }
  label .req{color:#e53e3e;margin-left:2px}
  input[type=text],input[type=date],select,textarea{
    width:100%;
    padding:8px 12px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    font-family:inherit;
    font-size:13px;
    color:var(--text);
    background:var(--white);
    transition:border-color .15s,box-shadow .15s;
    outline:none;
  }
  input:focus,select:focus,textarea:focus{
    border-color:var(--navy-light);
    box-shadow:0 0 0 3px rgba(46,117,182,.12);
  }
  textarea{resize:vertical;min-height:64px;line-height:1.5}

  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  /* 빠른 선택 */
  .preset-label{
    font-size:11px;font-weight:600;color:var(--text3);
    letter-spacing:.4px;text-transform:uppercase;
    margin-bottom:8px;
  }
  .preset-grid{
    display:flex;flex-wrap:wrap;gap:6px;
    margin-bottom:16px;
  }
  .preset-btn{
    font-family:inherit;
    font-size:12px;font-weight:500;
    padding:5px 10px;
    border:1px solid var(--border);
    border-radius:99px;
    background:var(--white);
    color:var(--text2);
    cursor:pointer;
    transition:all .15s;
  }
  .preset-btn:hover{
    background:var(--sky);
    border-color:var(--navy-light);
    color:var(--navy);
  }

  /* 생성 버튼 */
  .btn-generate{
    width:100%;
    padding:12px;
    background:var(--navy);
    color:#fff;
    border:none;
    border-radius:var(--radius);
    font-family:inherit;
    font-size:14px;font-weight:700;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:background .15s,transform .1s;
    margin-top:4px;
    letter-spacing:.2px;
  }
  .btn-generate:hover:not(:disabled){background:var(--navy-dark)}
  .btn-generate:active:not(:disabled){transform:scale(.98)}
  .btn-generate:disabled{background:#9aabba;cursor:not-allowed}

  .btn-reset{
    width:100%;margin-top:8px;
    padding:9px;
    background:transparent;
    color:var(--text3);
    border:1px solid var(--border);
    border-radius:var(--radius);
    font-family:inherit;font-size:13px;
    cursor:pointer;transition:all .15s;
  }
  .btn-reset:hover{background:var(--bg);color:var(--text2)}

  /* ── 결과 패널 ── */
  .result-panel{display:flex;flex-direction:column;gap:16px}

  /* 상태바 */
  .status-bar{
    display:none;
    padding:10px 14px;
    border-radius:var(--radius);
    font-size:13px;font-weight:500;
    align-items:center;gap:8px;
  }
  .status-bar.show{display:flex}
  .status-bar.info{background:#EBF3FB;color:var(--navy);border:1px solid #BDD7EE}
  .status-bar.success{background:var(--success-bg);color:var(--success);border:1px solid #a8f0b7}
  .status-bar.error{background:var(--error-bg);color:var(--error);border:1px solid #ffc0c0}

  /* 탭 */
  .doc-tabs{
    display:flex;
    border-bottom:2px solid var(--border);
    background:var(--white);
    border-radius:var(--radius-lg) var(--radius-lg) 0 0;
    overflow:hidden;
    border:1px solid var(--border);
    border-bottom:none;
  }
  .tab-btn{
    flex:1;padding:12px 8px;
    background:var(--bg);
    border:none;border-bottom:2px solid transparent;
    font-family:inherit;font-size:13px;font-weight:600;
    color:var(--text3);cursor:pointer;
    transition:all .15s;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .tab-btn:hover{background:var(--sky2);color:var(--navy)}
  .tab-btn.active{
    background:var(--white);
    color:var(--navy);
    border-bottom-color:var(--navy);
  }
  .tab-icon{font-size:15px}

  /* 문서 패널 */
  .doc-panels{
    background:var(--white);
    border:1px solid var(--border);
    border-top:none;
    border-radius:0 0 var(--radius-lg) var(--radius-lg);
    box-shadow:var(--shadow);
  }
  .doc-panel{display:none;padding:0}
  .doc-panel.active{display:block}

  .doc-toolbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;
    border-bottom:1px solid var(--border);
    background:var(--sky2);
    border-radius:0;
  }
  .doc-toolbar-title{
    font-size:12px;font-weight:700;
    color:var(--navy);letter-spacing:.3px;
    text-transform:uppercase;
  }
  .doc-toolbar-btns{display:flex;gap:6px}
  .tool-btn{
    font-family:inherit;font-size:12px;
    padding:5px 10px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:var(--white);
    color:var(--text2);
    cursor:pointer;transition:all .15s;
    display:flex;align-items:center;gap:4px;
  }
  .tool-btn:hover{background:var(--sky);color:var(--navy);border-color:var(--navy-light)}

  .doc-content{
    padding:20px;
    font-size:13px;
    line-height:1.8;
    color:var(--text);
    min-height:300px;
    white-space:pre-wrap;
    font-family:'Noto Sans KR',sans-serif;
  }
  .doc-content.empty{
    color:var(--text3);
    font-style:italic;
    display:flex;align-items:center;justify-content:center;
    min-height:300px;
  }
  .doc-content.streaming{
    color:var(--text);
  }

  /* 액션 버튼 */
  .action-row{
    display:none;
    gap:8px;flex-wrap:wrap;
  }
  .action-row.show{display:flex}
  .btn-action{
    flex:1;min-width:180px;
    padding:10px 16px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:var(--white);
    color:var(--text2);
    font-family:inherit;font-size:13px;font-weight:500;
    cursor:pointer;transition:all .15s;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn-action:hover{background:var(--sky2);border-color:var(--navy-light);color:var(--navy)}
  .btn-action.primary-action{
    background:var(--navy);color:#fff;border-color:var(--navy);
  }
  .btn-action.primary-action:hover{background:var(--navy-dark)}

  /* 빈 상태 */
  .empty-state{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:60px 20px;
    color:var(--text3);
    text-align:center;
    gap:12px;
  }
  .empty-icon{font-size:48px;opacity:.3}
  .empty-state p{font-size:14px;max-width:280px;line-height:1.6}

  /* 스피너 */
  @keyframes spin{to{transform:rotate(360deg)}}
  .spin{display:inline-block;animation:spin .8s linear infinite}

  /* 반짝이는 커서 */
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  .cursor{
    display:inline-block;width:2px;height:14px;
    background:var(--navy);
    vertical-align:middle;margin-left:1px;
    animation:blink .7s ease-in-out infinite;
  }

  /* 진행 표시 */
  .progress-steps{
    display:flex;align-items:center;gap:0;
    padding:14px 18px;
    border-bottom:1px solid var(--border);
  }
  .progress-step{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
    position:relative;
  }
  .progress-step::after{
    content:'';position:absolute;
    top:12px;left:50%;width:100%;height:2px;
    background:var(--border);z-index:0;
  }
  .progress-step:last-child::after{display:none}
  .step-dot{
    width:24px;height:24px;border-radius:50%;
    border:2px solid var(--border);
    background:var(--white);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:var(--text3);
    position:relative;z-index:1;transition:all .3s;
  }
  .step-dot.done{background:var(--navy);border-color:var(--navy);color:#fff}
  .step-dot.active{background:var(--white);border-color:var(--navy-light);color:var(--navy)}
  .step-label{font-size:11px;color:var(--text3);font-weight:500;white-space:nowrap}
  .step-label.done{color:var(--navy)}
  .step-label.active{color:var(--navy-light)}

  /* 반응형 */
  @media(max-width:768px){
    .container{grid-template-columns:1fr;padding:16px}
    .form-row{grid-template-columns:1fr}
  }

  /* 인쇄 스타일 */
  @media print{
    .site-header,.left-col,.doc-tabs,.doc-toolbar,.action-row,.status-bar{display:none!important}
    .doc-panel{display:block!important}
    .container{grid-template-columns:1fr}
  }

  .divider{height:1px;background:var(--border);margin:16px 0}
  .section-label{
    font-size:11px;font-weight:700;color:var(--text3);
    letter-spacing:.5px;text-transform:uppercase;
    margin-bottom:10px;
  }
  .tip{
    background:var(--sky2);border-left:3px solid var(--navy-light);
    padding:8px 12px;border-radius:0 var(--radius) var(--radius) 0;
    font-size:12px;color:var(--text2);margin-top:14px;
  }
</style>

<script>
// ── 사업소 설정 초기화 ──────────────────────────────────────
(function(){
  const saved = localStorage.getItem('fm_org') ?
    JSON.parse(localStorage.getItem('fm_org')) : null;
  if(!saved){
    // 최초 실행: 설정 팝업
    document.addEventListener('DOMContentLoaded', function(){
      showOrgSetup();
    });
  }
})();

function showOrgSetup(){
  const overlay = document.createElement('div');
  overlay.id = 'org-setup-overlay';
  overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center;font-family:"맑은 고딕",sans-serif';
  overlay.innerHTML = `
    <div style="background:#fff;border-radius:12px;padding:36px 40px;max-width:440px;width:90%;box-shadow:0 8px 40px rgba(0,0,0,.2)">
      <div style="text-align:center;margin-bottom:24px">
        <div style="font-size:36px;margin-bottom:8px">🏢</div>
        <h2 style="color:#1F4E79;font-size:18px;margin:0 0 6px">시설관리 프로그램 설정</h2>
        <p style="color:#718096;font-size:13px;margin:0">최초 1회만 입력하면 이후 자동 저장됩니다.</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div>
          <label style="font-size:12px;font-weight:600;color:#4a5568;display:block;margin-bottom:4px">회사명 / 사업소명 *</label>
          <input id="setup-org" type="text" placeholder="예) 한국마사회시설관리 대구사업소"
            style="width:100%;padding:9px 12px;border:1px solid #e2e8f0;border-radius:7px;font-family:inherit;font-size:14px;outline:none;box-sizing:border-box">
        </div>
        <div>
          <label style="font-size:12px;font-weight:600;color:#4a5568;display:block;margin-bottom:4px">반장 / 담당자 이름</label>
          <input id="setup-leader" type="text" placeholder="예) 김재홀"
            style="width:100%;padding:9px 12px;border:1px solid #e2e8f0;border-radius:7px;font-family:inherit;font-size:14px;outline:none;box-sizing:border-box">
        </div>
        <div>
          <label style="font-size:12px;font-weight:600;color:#4a5568;display:block;margin-bottom:4px">전기안전관리자 이름</label>
          <input id="setup-elec" type="text" placeholder="예) 이준호"
            style="width:100%;padding:9px 12px;border:1px solid #e2e8f0;border-radius:7px;font-family:inherit;font-size:14px;outline:none;box-sizing:border-box">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div>
            <label style="font-size:12px;font-weight:600;color:#4a5568;display:block;margin-bottom:4px">담당자1</label>
            <input id="setup-p1" type="text" placeholder="예) 배진영"
              style="width:100%;padding:9px 12px;border:1px solid #e2e8f0;border-radius:7px;font-family:inherit;font-size:13px;outline:none;box-sizing:border-box">
          </div>
          <div>
            <label style="font-size:12px;font-weight:600;color:#4a5568;display:block;margin-bottom:4px">담당자2</label>
            <input id="setup-p2" type="text" placeholder="예) 박성웅"
              style="width:100%;padding:9px 12px;border:1px solid #e2e8f0;border-radius:7px;font-family:inherit;font-size:13px;outline:none;box-sizing:border-box">
          </div>
        </div>
      </div>
      <button onclick="saveOrgSetup()"
        style="width:100%;margin-top:20px;padding:12px;background:#1F4E79;color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer">
        ✅ 저장하고 시작하기
      </button>
      <p style="text-align:center;font-size:12px;color:#a0aec0;margin:12px 0 0">설정은 언제든지 우측 상단 ⚙ 버튼으로 변경 가능합니다</p>
    </div>`;
  document.body.appendChild(overlay);
  setTimeout(()=>document.getElementById('setup-org').focus(),100);
}

function saveOrgSetup(){
  const org    = document.getElementById('setup-org').value.trim()    || '우리 사업소';
  const leader = document.getElementById('setup-leader').value.trim() || '반장';
  const elec   = document.getElementById('setup-elec').value.trim()   || '전기안전관리자';
  const p1     = document.getElementById('setup-p1').value.trim()     || '담당자1';
  const p2     = document.getElementById('setup-p2').value.trim()     || '담당자2';
  const cfg = {org,leader,elec,p1,p2};
  localStorage.setItem('fm_org', JSON.stringify(cfg));
  document.getElementById('org-setup-overlay')?.remove();
  applyOrgName(cfg);
  location.reload();
}

function getOrg(){
  try{ return JSON.parse(localStorage.getItem('fm_org'))||{org:'우리 사업소',leader:'반장',elec:'전기안전관리자',p1:'담당자1',p2:'담당자2'}; }
  catch(e){ return {org:'우리 사업소',leader:'반장',elec:'전기안전관리자',p1:'담당자1',p2:'담당자2'}; }
}

function applyOrgName(cfg){
  cfg = cfg || getOrg();
  // 페이지 내 텍스트 치환
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  while(walker.nextNode()){
    const n = walker.currentNode;
    if(n.nodeValue.includes('한국마사회시설관리 대구사업소') ||
       n.nodeValue.includes('대구사업소') ||
       n.nodeValue.includes('KRA 대구지사 빌딩')){
      n.nodeValue = n.nodeValue
        .replace(/한국마사회시설관리 대구사업소/g, cfg.org)
        .replace(/KRA 대구지사 빌딩/g, cfg.org)
        .replace(/대구사업소/g, cfg.org);
    }
    if(n.nodeValue.includes('김재홀')||n.nodeValue.includes('김 재 홀')){
      n.nodeValue=n.nodeValue.replace(/김 재 홀/g,cfg.leader).replace(/김재홀/g,cfg.leader);
    }
    if(n.nodeValue.includes('이준호')||n.nodeValue.includes('이 준 호')){
      n.nodeValue=n.nodeValue.replace(/이 준 호/g,cfg.elec).replace(/이준호/g,cfg.elec);
    }
    if(n.nodeValue.includes('배진영')){
      n.nodeValue=n.nodeValue.replace(/배진영/g,cfg.p1);
    }
    if(n.nodeValue.includes('박성웅')){
      n.nodeValue=n.nodeValue.replace(/박성웅/g,cfg.p2);
    }
  }
  // title도 교체
  document.title = document.title.replace(/대구사업소|한국마사회시설관리 대구사업소|KRA 대구지사 빌딩/g, cfg.org);
}

// 설정 버튼 추가
function addSettingBtn(){
  const cfg=getOrg();
  const btn=document.createElement('button');
  btn.innerHTML='⚙ '+cfg.org;
  btn.style.cssText='position:fixed;bottom:20px;right:20px;background:#1F4E79;color:#fff;border:none;padding:10px 16px;border-radius:99px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;z-index:1000;box-shadow:0 4px 12px rgba(0,0,0,.2)';
  btn.onclick=()=>{ localStorage.removeItem('fm_org'); location.reload(); };
  btn.title='클릭하면 사업소 설정 재입력';
  document.body.appendChild(btn);
  // 이름 적용
  applyOrgName(cfg);
}

document.addEventListener('DOMContentLoaded', function(){
  const cfg = getOrg();
  if(cfg.org !== '우리 사업소'){
    applyOrgName(cfg);
    addSettingBtn();
  } else {
    showOrgSetup();
  }
});
</script>
</head>
<body>

<header class="site-header">
  <div class="logo">
    <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
      <rect x="2" y="2" width="16" height="16" rx="3" stroke="rgba(255,255,255,.7)" stroke-width="1.5"/>
      <path d="M6 7h8M6 10h8M6 13h5" stroke="rgba(255,255,255,.9)" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    한국마사회시설관리 대구사업소
    <span class="logo-badge">AI</span>
  </div>
  <span class="sub">안전서류 자동생성 시스템 v2.0</span>
</header>

<div class="container">

  <!-- 왼쪽: 입력 폼 -->
  <div class="left-col">
    <div class="card">
      <div class="card-header">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">

function toggleKey(){
  const inp=document.getElementById('f-apikey');
  const btn=document.getElementById('key-toggle');
  if(inp.type==='password'){inp.type='text';btn.textContent='숨기기';}
  else{inp.type='password';btn.textContent='보기';}
}

function getV(){
  return {
    apikey:  document.getElementById('f-apikey').value.trim(),
    name:    document.getElementById('f-name').value.trim(),
    date:    document.getElementById('f-date').value.trim()  || '2026년 6월 29일',
    place:   document.getElementById('f-place').value.trim() || '대구사업소',
    company: document.getElementById('f-company').value.trim() || '협력업체',
    period:  document.getElementById('f-period').value.trim() || '1일',
    detail:  document.getElementById('f-detail').value.trim(),
    type:    document.getElementById('f-type').value,
    leader:  document.getElementById('f-leader').value.trim() || '김재홀 (반장)',
  };
}

function fillPreset(name,type,company,period,detail){
  document.getElementById('f-name').value=name;
  document.getElementById('f-type').value=type;
  document.getElementById('f-company').value=company;
  document.getElementById('f-period').value=period;
  document.getElementById('f-detail').value=detail;
  const today=new Date();
  document.getElementById('f-date').value=
    `2026년 ${today.getMonth()+1}월 ${today.getDate()}일`;
}

function switchTab(n){
  document.querySelectorAll('.tab-btn').forEach((t,i)=>t.classList.toggle('active',i===n));
  document.querySelectorAll('.doc-panel').forEach((p,i)=>p.classList.toggle('active',i===n));
}

function setStatus(msg,type){
  const s=document.getElementById('status-bar');
  const icons={info:'⏳',success:'✅',error:'❌'};
  s.className='status-bar show '+type;
  s.innerHTML=icons[type]+' '+msg;
}
function hideStatus(){document.getElementById('status-bar').className='status-bar';}

function setStep(n){
  for(let i=0;i<3;i++){
    const dot=document.getElementById('step-dot-'+i);
    const lbl=document.getElementById('step-lbl-'+i);
    if(i<n){dot.className='step-dot done';dot.innerHTML='✓';lbl.className='step-label done';}
    else if(i===n){dot.className='step-dot active';dot.innerHTML=i+1;lbl.className='step-label active';}
    else{dot.className='step-dot';dot.innerHTML=i+1;lbl.className='step-label';}
  }
}

async function generateDocs(){
  const v=getV();
  if(!v.apikey){alert('Anthropic API Key를 입력해주세요.');document.getElementById('f-apikey').focus();return;}
  if(!v.apikey.startsWith('sk-ant-')){alert('올바른 API Key 형식이 아닙니다.\n(sk-ant- 로 시작해야 합니다)');return;}
  if(!v.name){alert('작업명을 입력해주세요.');return;}

  const btn=document.getElementById('gen-btn');
  btn.disabled=true;
  btn.innerHTML='<span class="spin">⟳</span> AI 생성 중...';

  document.getElementById('progress-steps').style.display='flex';
  document.getElementById('action-row').className='action-row';

  for(let i=0;i<3;i++){
    const box=document.getElementById('doc-'+i);
    box.className='doc-content';
    box.innerHTML='';
  }
  switchTab(0);

  for(let i=0;i<3;i++){
    setStep(i);
    setStatus(`${LABELS[i]} 생성 중... (${i+1}/3)`,'info');
    switchTab(i);

    const box=document.getElementById('doc-'+i);
    box.className='doc-content streaming';
    box.innerHTML='';
    let cursor=document.createElement('span');
    cursor.className='cursor';
    box.appendChild(cursor);

    try{
      const res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'x-api-key': v.apikey,
          'anthropic-version':'2023-06-01',
          'anthropic-beta':'interop-2025-05-14',
          'anthropic-dangerous-direct-browser-access':'true',
        },
        body:JSON.stringify({
          model:'claude-sonnet-4-6',
          max_tokens:1000,
          stream:true,
          messages:[{role:'user',content:PROMPTS[i](v)}]
        })
      });

      if(!res.ok){throw new Error('API 오류: '+res.status);}

      const reader=res.body.getReader();
      const dec=new TextDecoder();
      let buf='';
      let textNode=document.createTextNode('');
      box.insertBefore(textNode,cursor);

      while(true){
        const {done,value}=await reader.read();
        if(done) break;
        buf+=dec.decode(value,{stream:true});
        const lines=buf.split('\n');
        buf=lines.pop();
        for(const line of lines){
          if(!line.startsWith('data: ')) continue;
          const data=line.slice(6).trim();
          if(data==='[DONE]') continue;
          try{
            const j=JSON.parse(data);
            if(j.type==='content_block_delta'&&j.delta?.text){
              textNode.textContent+=j.delta.text;
              box.scrollTop=box.scrollHeight;
            }
          }catch(e){}
        }
      }
      cursor.remove();
      box.className='doc-content';

    }catch(e){
      cursor.remove();
      box.innerHTML='<span style="color:var(--error)">오류: '+e.message+'</span>';
      box.className='doc-content';
      setStatus('오류가 발생했습니다. 잠시 후 다시 시도해주세요.','error');
      btn.disabled=false;
      btn.innerHTML='<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="8" r="3" stroke="#fff" stroke-width="1.4"/></svg> 3종 문서 AI 자동생성';
      setStep(99);
      return;
    }
  }

  setStep(99);
  setStatus('3종 문서 생성 완료! 각 탭에서 내용을 확인하세요.','success');
  document.getElementById('action-row').className='action-row show';
  btn.disabled=false;
  btn.innerHTML='<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="8" r="3" stroke="#fff" stroke-width="1.4"/></svg> 다시 생성';
}

function clearAll(){
  ['f-name','f-date','f-place','f-company','f-period','f-detail'].forEach(id=>{
    document.getElementById(id).value='';
  });
  document.getElementById('f-type').value='기계·설비';
  document.getElementById('f-leader').value='김재홀 (반장)';
  for(let i=0;i<3;i++){
    const box=document.getElementById('doc-'+i);
    const icons=['📋','🗣','✅'];
    const titles=['작업 정보를 입력하고<br>AI 자동생성 버튼을 누르면<br>문서가 여기에 나타납니다.','TBM 일지가 여기에 생성됩니다.','작업완료보고서가 여기에 생성됩니다.'];
    box.className='doc-content empty';
    box.innerHTML=`<div class="empty-state"><div class="empty-icon">${icons[i]}</div><p>${titles[i]}</p></div>`;
  }
  document.getElementById('action-row').className='action-row';
  document.getElementById('progress-steps').style.display='none';
  hideStatus();
  document.getElementById('gen-btn').innerHTML='<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="8" r="3" stroke="#fff" stroke-width="1.4"/></svg> 3종 문서 AI 자동생성';
  switchTab(0);
}

function copyDoc(n){
  const text=document.getElementById('doc-'+n).innerText;
  navigator.clipboard.writeText(text).then(()=>{
    const btns=document.querySelectorAll('.doc-toolbar-btns .tool-btn');
    const idx=n*2;
    const btn=btns[idx];
    const orig=btn.innerHTML;
    btn.innerHTML='✅ 복사됨';
    setTimeout(()=>btn.innerHTML=orig,1500);
  });
}

function printDoc(n){
  const content=document.getElementById('doc-'+n).innerText;
  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
  <style>body{font-family:'Noto Sans KR',sans-serif;padding:30px;font-size:13px;line-height:1.8;white-space:pre-wrap;color:#1a1a2e}</style>
  </head><body>${content}</body></html>`);
  w.document.close();w.print();
}

function requestWord(){
  const v=getV();
  const msg=`작업명: ${v.name} / 작업일시: ${v.date} / 장소: ${v.place} / 업체: ${v.company} / 기간인원: ${v.period}\n위의 AI 생성 내용을 반영해서 Word(.docx) 파일로 만들어줘`;
  try{window.parent.postMessage({type:'sendMessage',text:msg},'*');}
  catch(e){alert('Word 파일 생성 요청:\n'+msg);}
}

function requestEdit(){
  const v=getV();
  const msg=`${v.name} 작업 3종 문서 내용 중 수정하고 싶은 부분이 있어. 확인 후 변경 요청할게.`;
  try{window.parent.postMessage({type:'sendMessage',text:msg},'*');}
  catch(e){alert(msg);}
}

function requestPrint(){
  window.print();
}
